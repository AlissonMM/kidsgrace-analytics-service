# Formato ${VARIAVEL:default}: o default serve para rodar localmente sem
# configurar nada; em Docker/produção os valores vêm de variáveis de ambiente.

# Nome da aplicação
quarkus.application.name=morkstore-analytics-service

# ========================================
# Configuração do canal de entrada "users"
# ========================================

# Canal user-analytics
mp.messaging.incoming.user-analytics.connector=smallrye-kafka

# Tópico Kafka
mp.messaging.incoming.user-analytics.topic=users.events

# Broker Kafka
mp.messaging.incoming.user-analytics.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group
mp.messaging.incoming.user-analytics.group.id=morkstore-analytics-service


# ========================================
# Configuração do canal de entrada "products"
# ========================================

# Canal product-analytics
mp.messaging.incoming.product-analytics.connector=smallrye-kafka

# Tópico Kafka
mp.messaging.incoming.product-analytics.topic=products.events

# Broker Kafka
mp.messaging.incoming.product-analytics.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group
mp.messaging.incoming.product-analytics.group.id=morkstore-analytics-service


# ========================================
# Configuração do canal de entrada "orders"
# ========================================

# Canal order-analytics
mp.messaging.incoming.order-analytics.connector=smallrye-kafka

# Tópico Kafka
mp.messaging.incoming.order-analytics.topic=orders.events

# Broker Kafka
mp.messaging.incoming.order-analytics.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Consumer Group
mp.messaging.incoming.order-analytics.group.id=morkstore-analytics-service

quarkus.swagger-ui.always-include=true


# ========================================
# CORS (dashboard Angular em localhost:4200)
# ========================================

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
quarkus.http.cors.methods=GET,OPTIONS
quarkus.http.cors.headers=Authorization,Content-Type


# ========================================
# MySQL
# ========================================

quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:mysql://localhost:3306/morkstore_analytics}
quarkus.datasource.username=${DB_USERNAME:root}
quarkus.datasource.password=${DB_PASSWORD:root}

# ========================================
# Hibernate ORM
# ========================================

quarkus.hibernate-orm.schema-management.strategy=update
quarkus.hibernate-orm.log.sql=${LOG_SQL:true}


# Porta da aplicação
quarkus.http.port=8091


# ========================================
# JWT
# ========================================

# Precisa ser o MESMO segredo da morkstore-api, que emite os tokens.
# O default abaixo é só para desenvolvimento local.
app.jwt.secret=${JWT_SECRET:dev-only-secret-troque-em-producao-0123456789}
